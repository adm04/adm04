<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Dot Matrix Background Pattern -->
    <pattern id="globeDotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#222222"/>
    </pattern>

    <!-- Signal Red Pulse Filter -->
    <filter id="redPulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arc Gradient -->
    <linearGradient id="globeArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#999999" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- OLED Outer Container -->
  <rect width="796" height="396" x="2" y="2" fill="#0A0A0A" stroke="#222222" stroke-width="1.5"/>

  <!-- Dot Grid Pattern -->
  <rect width="796" height="396" x="2" y="2" fill="url(#globeDotGrid)"/>

  <!-- Left Side: 3D Wireframe Globe -->
  <g transform="translate(0,0)">
    <!-- Tech Orbit Ring 1 -->
    <g>
      <circle cx="250" cy="200" r="140" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="6 6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 200" to="360 250 200" dur="25s" repeatCount="indefinite"/>
    </g>

    <!-- Tech Orbit Ring 2 -->
    <g>
      <circle cx="250" cy="200" r="154" fill="none" stroke="#222222" stroke-width="1" stroke-dasharray="12 8"/>
      <animateTransform attributeName="transform" type="rotate" from="360 250 200" to="0 250 200" dur="35s" repeatCount="indefinite"/>
    </g>

    <!-- Globe Base Outer Ring -->
    <circle cx="250" cy="200" r="120" fill="#111111" stroke="#333333" stroke-width="1.5"/>

    <!-- 3D Latitude Lines -->
    <ellipse cx="250" cy="200" rx="120" ry="35" fill="none" stroke="#333333" stroke-width="1"/>
    <ellipse cx="250" cy="200" rx="120" ry="70" fill="none" stroke="#222222" stroke-width="1"/>
    <ellipse cx="250" cy="200" rx="120" ry="100" fill="none" stroke="#222222" stroke-width="1"/>

    <!-- 3D Longitude Lines -->
    <ellipse cx="250" cy="200" rx="35" ry="120" fill="none" stroke="#333333" stroke-width="1"/>
    <ellipse cx="250" cy="200" rx="75" ry="120" fill="none" stroke="#222222" stroke-width="1"/>
    <line x1="250" y1="80" x2="250" y2="320" stroke="#333333" stroke-width="1"/>

    <!-- Rotating Region Dot Nodes -->
    <g>
      <!-- India / Asia Nodes -->
      <circle cx="280" cy="170" r="3.5" fill="#FFFFFF"/>
      <circle cx="270" cy="165" r="2.5" fill="#999999"/>
      <circle cx="290" cy="160" r="2.5" fill="#999999"/>
      <circle cx="300" cy="175" r="2.5" fill="#999999"/>
      <circle cx="265" cy="180" r="2.5" fill="#999999"/>
      <!-- Europe / Africa Nodes -->
      <circle cx="220" cy="150" r="2.5" fill="#666666"/>
      <circle cx="210" cy="140" r="2" fill="#666666"/>
      <circle cx="230" cy="165" r="2" fill="#666666"/>
      <circle cx="225" cy="190" r="2.5" fill="#666666"/>
      <!-- Americas Nodes -->
      <circle cx="160" cy="160" r="2" fill="#444444"/>
      <circle cx="170" cy="175" r="2.5" fill="#444444"/>
      <circle cx="180" cy="220" r="2" fill="#444444"/>

      <animateTransform attributeName="transform" type="rotate" from="0 250 200" to="360 250 200" dur="40s" repeatCount="indefinite"/>
    </g>

    <!-- Flight Vector Arc -->
    <path d="M 280 170 Q 220 100 160 160" fill="none" stroke="url(#globeArc)" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Signal Red Active Location Pulse on India Point -->
    <g transform="translate(280, 170)">
      <circle cx="0" cy="0" r="6" fill="#D71921" fill-opacity="0.4" filter="url(#redPulseGlow)">
        <animate attributeName="r" values="3;16;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="4" fill="#D71921"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Technical Location Tag -->
    <g transform="translate(295, 142)">
      <rect width="130" height="26" fill="#111111" stroke="#333333" stroke-width="1"/>
      <text x="10" y="17" font-family="'Space Mono', monospace" font-size="10" fill="#E8E8E8">LOC: INDIA (IST)</text>
    </g>
  </g>

  <!-- Right Side: Instrument Parameter Panel -->
  <g transform="translate(450, 50)">
    <!-- Header Title -->
    <text x="0" y="24" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" letter-spacing="1">
      [03 // GLOBAL MATRIX]
    </text>

    <!-- Subtitle -->
    <text x="0" y="46" font-family="'Space Mono', monospace" font-size="11" fill="#666666" letter-spacing="1">
      LOCATION &amp; REMOTE MATRIX READOUT
    </text>

    <line x1="0" y1="60" x2="310" y2="60" stroke="#222222" stroke-width="1"/>

    <!-- Information Bullets (Instrument Rows) -->
    <g transform="translate(0, 85)">
      <!-- Row 1 -->
      <circle cx="4" cy="8" r="3" fill="#D71921"/>
      <text x="18" y="12" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#999999">LOCATION:</text>
      <text x="110" y="12" font-family="'Space Mono', monospace" font-size="11" fill="#E8E8E8">KOLKATA, INDIA (IST)</text>

      <!-- Row 2 -->
      <circle cx="4" cy="38" r="3" fill="#E8E8E8"/>
      <text x="18" y="42" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#999999">TIMEZONE:</text>
      <text x="110" y="42" font-family="'Space Mono', monospace" font-size="11" fill="#E8E8E8">UTC +5:30 (IST)</text>

      <!-- Row 3 -->
      <circle cx="4" cy="68" r="3" fill="#E8E8E8"/>
      <text x="18" y="72" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#999999">MODEL:</text>
      <text x="110" y="72" font-family="'Space Mono', monospace" font-size="11" fill="#E8E8E8">REMOTE / WORLDWIDE</text>

      <!-- Row 4 -->
      <circle cx="4" cy="98" r="3" fill="#E8E8E8"/>
      <text x="18" y="102" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#999999">LANGUAGES:</text>
      <text x="110" y="102" font-family="'Space Mono', monospace" font-size="11" fill="#E8E8E8">ENGLISH, BENGALI, HINDI</text>
    </g>

    <!-- Status Readout Box -->
    <g transform="translate(0, 225)">
      <rect width="310" height="36" fill="#111111" stroke="#222222" stroke-width="1"/>
      <circle cx="16" cy="18" r="3.5" fill="#D71921" filter="url(#redPulseGlow)"/>
      <text x="30" y="22" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" fill="#E8E8E8" letter-spacing="0.5">STATUS: AVAILABLE FOR FREELANCE</text>
    </g>
  </g>
</svg>
