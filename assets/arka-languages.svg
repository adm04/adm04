<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%" height="100%">
  <defs>
    <!-- Dot Matrix Grid Pattern -->
    <pattern id="langDotGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1" fill="#222222"/>
    </pattern>

    <!-- Signal Red Accent Glow -->
    <filter id="langRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes ringPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .mono { font-family: 'Space Mono', 'Courier New', monospace; }
    .ring-anim { animation: ringPulse 3s ease-in-out infinite; }
  </style>

  <!-- OLED Dark Background -->
  <rect width="380" height="220" fill="#0A0A0A" stroke="#222222" stroke-width="1.5"/>

  <!-- Dot Grid Pattern -->
  <rect width="380" height="220" fill="url(#langDotGrid)"/>

  <!-- Corner Industrial Crosshairs -->
  <g stroke="#444444" stroke-width="1">
    <path d="M 6,10 H 16 M 10,6 V 16"/>
    <path d="M 364,10 H 374 M 370,6 V 16"/>
    <path d="M 6,210 H 16 M 10,204 V 214"/>
    <path d="M 364,210 H 374 M 370,204 V 214"/>
  </g>

  <!-- Header Title -->
  <text x="20" y="32" class="mono" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1">
    [01 // TOP LANGUAGES]
  </text>
  <text x="20" y="48" class="mono" font-size="9" fill="#666666">
    REPOSITORY BREAKDOWN MATRIX
  </text>

  <line x1="20" y1="58" x2="360" y2="58" stroke="#222222" stroke-width="1"/>

  <!-- Left Side: Monochromatic Legend List -->
  <g transform="translate(20, 78)" class="mono" font-size="10">
    <!-- Item 1: TypeScript (50%) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="10" height="10" fill="#FFFFFF"/>
      <text x="18" y="9" fill="#FFFFFF" font-weight="bold">TypeScript</text>
      <text x="120" y="9" fill="#FFFFFF">50.0%</text>
    </g>

    <!-- Item 2: JavaScript (20%) -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="10" height="10" fill="#CCCCCC"/>
      <text x="18" y="9" fill="#E8E8E8">JavaScript</text>
      <text x="120" y="9" fill="#CCCCCC">20.0%</text>
    </g>

    <!-- Item 3: HTML / CSS (15%) -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="10" height="10" fill="#999999"/>
      <text x="18" y="9" fill="#999999">HTML / CSS</text>
      <text x="120" y="9" fill="#999999">15.0%</text>
    </g>

    <!-- Item 4: Python (10%) -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="10" height="10" fill="#555555"/>
      <text x="18" y="9" fill="#666666">Python</text>
      <text x="120" y="9" fill="#666666">10.0%</text>
    </g>

    <!-- Item 5: Other (5% Signal Red) -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="10" height="10" fill="#D71921" filter="url(#langRedGlow)"/>
      <text x="18" y="9" fill="#D71921" font-weight="bold">Other</text>
      <text x="120" y="9" fill="#D71921">5.0%</text>
    </g>
  </g>

  <!-- Right Side: Segmented Monochromatic Arc Ring Chart -->
  <g transform="translate(275, 138)" class="ring-anim">
    <!-- Center Hub Fill -->
    <circle cx="0" cy="0" r="28" fill="#111111" stroke="#222222" stroke-width="1"/>
    <text x="0" y="3" class="mono" font-size="9" fill="#999999" text-anchor="middle" font-weight="bold">ADM04</text>

    <!-- Segment 1: TypeScript (180deg arc) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-dasharray="145 145" transform="rotate(-90)"/>

    <!-- Segment 2: JavaScript (72deg arc) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#CCCCCC" stroke-width="16" stroke-dasharray="58 232" transform="rotate(90)"/>

    <!-- Segment 3: HTML / CSS (54deg arc) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#999999" stroke-width="16" stroke-dasharray="44 246" transform="rotate(162)"/>

    <!-- Segment 4: Python (36deg arc) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#555555" stroke-width="16" stroke-dasharray="29 261" transform="rotate(216)"/>

    <!-- Segment 5: Other (18deg arc - Signal Red) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#D71921" stroke-width="16" stroke-dasharray="15 275" transform="rotate(252)" filter="url(#langRedGlow)"/>

    <!-- Concentric Technical Wireframe Ring -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#222222" stroke-width="1" stroke-dasharray="2 4"/>
  </g>
</svg>
