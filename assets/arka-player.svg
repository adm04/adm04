<svg viewBox="0 0 400 580" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <path id="arcTop" d="M 92,215 A 108,108 0 0 1 288,215" />
    <path id="arcBottom" d="M 300,250 A 118,118 0 0 1 165,331" />

    <!-- Red Signal LED Glow Filter -->
    <filter id="playerRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radar Scan Line Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71921"/>
      <stop offset="100%" stop-color="#FF3B44"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes discSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes progressPulse {
      0% { x2: 120; }
      50% { x2: 280; }
      100% { x2: 120; }
    }
    .disc-spin {
      transform-origin: 200px 215px;
      animation: discSpin 9s linear infinite;
    }
    .progress-bar-anim {
      animation: progressPulse 10s linear infinite;
    }
    .dim { fill: #6b6b6b; }
    .dimS { stroke: #6b6b6b; }
    .line { stroke: #2a2a2a; }
    .bright { fill: #eaeaea; }
    .brightS { stroke: #eaeaea; }
    .mono { letter-spacing: 1.5px; font-family: 'Space Mono', 'Courier New', monospace; }
  </style>

  <!-- Player Outer Container -->
  <rect x="0" y="0" width="400" height="580" rx="26" fill="#0a0a0a" stroke="#222222" stroke-width="1.5"/>

  <!-- Top System Header -->
  <path d="M 30,32 L 20,40 L 30,48" fill="none" stroke="#eaeaea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="36" text-anchor="middle" class="dim mono" font-size="10">PLAYING FROM</text>
  <text x="200" y="50" text-anchor="middle" class="bright mono" font-size="11" font-weight="bold">SPOTIFY // THE BATMAN</text>

  <circle cx="372" cy="30" r="1.6" fill="#1DB954"/>
  <circle cx="372" cy="40" r="1.6" fill="#1DB954"/>
  <circle cx="372" cy="50" r="1.6" fill="#1DB954"/>

  <text x="30" y="90" class="dim mono" font-size="9">02:17/03:32</text>
  <text x="125" y="90" fill="#D71921" class="mono" font-size="9" font-weight="bold">1x [LIVE]</text>

  <circle cx="352" cy="98" r="11" fill="none" class="line" stroke-width="1"/>
  <polygon points="348,93 348,103 356,98" fill="#1DB954"/>

  <!-- Spinning Vinyl Disc Group -->
  <g class="disc-spin">
    <circle cx="200" cy="215" r="130" fill="#141414" stroke="#242424" stroke-width="1" stroke-dasharray="1 4"/>
    <line x1="140" y1="155" x2="260" y2="275" class="line" stroke-width="1"/>
    <text class="dim mono" font-size="10"><textPath href="#arcTop" startOffset="6%">MICHAEL GIACCHINO</textPath></text>
    <text class="dim mono" font-size="10"><textPath href="#arcBottom" startOffset="8%">THE BATMAN SCORE</textPath></text>
    <circle cx="200" cy="215" r="33" fill="#050505" stroke="#242424" stroke-width="1"/>
    <circle cx="200" cy="215" r="33" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-dasharray="2 3"/>
    <circle cx="200" cy="215" r="5" fill="#0a0a0a" stroke="#D71921" stroke-width="1.5"/>
  </g>

  <path d="M 332,325 A 130,130 0 0 0 300,345" fill="none" stroke="#5a5a5a" stroke-width="3" stroke-linecap="round"/>

  <!-- Signal Red Active Status LED -->
  <circle cx="42" cy="350" r="6" fill="#D71921" filter="url(#playerRedGlow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Extra Control Icon -->
  <circle cx="60" cy="410" r="20" fill="none" class="line" stroke-width="1"/>
  <line x1="52" y1="404" x2="68" y2="404" class="dimS" stroke-width="1.4"/>
  <line x1="52" y1="410" x2="68" y2="410" class="dimS" stroke-width="1.4"/>
  <line x1="52" y1="416" x2="62" y2="416" class="dimS" stroke-width="1.4"/>

  <!-- Title Pill Box -->
  <rect x="98" y="392" width="204" height="36" rx="18" fill="#111111" stroke="#333333" stroke-width="1"/>
  <text id="trackTitle" x="200" y="415" text-anchor="middle" class="bright mono" font-size="12" font-weight="bold" letter-spacing="2">THE BATMAN</text>

  <!-- Right Favorite Icon -->
  <circle cx="340" cy="410" r="20" fill="none" class="line" stroke-width="1"/>
  <polygon points="340,401 343,407 350,408 345,412 346,419 340,416 334,419 335,412 330,408 337,407" fill="#D71921"/>

  <!-- Prev Button -->
  <circle cx="82" cy="474" r="27" fill="#161616" stroke="#222222" stroke-width="1"/>
  <rect x="70" y="464" width="2.4" height="20" class="bright"/>
  <polygon points="90,464 90,484 76,474" class="bright"/>

  <!-- Play/Pause Pill Button -->
  <rect x="140" y="447" width="120" height="54" rx="27" fill="#FFFFFF"/>
  <polygon points="192,463 192,485 214,474" fill="#0A0A0A"/>

  <!-- Next Button -->
  <circle cx="318" cy="474" r="27" fill="#161616" stroke="#222222" stroke-width="1"/>
  <rect x="326.6" y="464" width="2.4" height="20" class="bright"/>
  <polygon points="310,464 310,484 324,474" class="bright"/>

  <!-- Progress Bar & Slider -->
  <polygon points="28,516 34,512 34,524 28,520" class="dim"/>
  <path d="M 36,514 A 6,6 0 0 1 36,522" fill="none" class="dimS" stroke-width="1.2"/>
  <line x1="48" y1="518" x2="352" y2="518" stroke="#2a2a2a" stroke-width="2"/>
  <line class="progress-bar-anim" x1="48" y1="518" x2="200" y2="518" stroke="url(#progressGrad)" stroke-width="2"/>
  <circle cx="200" cy="518" r="5" class="bright" fill="#FFFFFF"/>
  <polygon points="372,512 366,516 366,520 372,524" class="bright"/>
  <path d="M 364,514 A 6,6 0 0 1 364,522" fill="none" class="brightS" stroke-width="1.2"/>

  <!-- Bottom Details & Navigation Lines -->
  <line x1="66" y1="550" x2="94" y2="550" class="dimS" stroke-width="1.4"/>
  <line x1="66" y1="556" x2="94" y2="556" class="dimS" stroke-width="1.4"/>
  <line x1="66" y1="562" x2="86" y2="562" class="dimS" stroke-width="1.4"/>

  <path d="M 180,552 L 220,552 M 214,546 L 220,552 L 214,558" fill="none" class="dimS" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 220,562 L 180,562 M 186,556 L 180,562 L 186,568" fill="none" class="dimS" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 306,556 A 14,10 0 1 1 320,566" fill="none" class="dimS" stroke-width="1.4"/>
  <polygon points="318,559 322,566 314,567" fill="#D71921"/>
</svg>
