<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%" height="100%">
  <defs>
    <!-- Dot Matrix Grid Pattern -->
    <pattern id="timeDotGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1" fill="#222222"/>
    </pattern>

    <!-- Signal Red Bar Glow Filter -->
    <filter id="timeRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes peakBarPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; fill: #FF3B44; }
    }
    .mono { font-family: 'Space Mono', 'Courier New', monospace; }
    .peak-anim { animation: peakBarPulse 2.5s ease-in-out infinite; }
  </style>

  <!-- OLED Dark Background -->
  <rect width="380" height="220" fill="#0A0A0A" stroke="#222222" stroke-width="1.5"/>

  <!-- Dot Grid Pattern -->
  <rect width="380" height="220" fill="url(#timeDotGrid)"/>

  <!-- Corner Industrial Crosshairs -->
  <g stroke="#444444" stroke-width="1">
    <path d="M 6,10 H 16 M 10,6 V 16"/>
    <path d="M 364,10 H 374 M 370,6 V 16"/>
    <path d="M 6,210 H 16 M 10,204 V 214"/>
    <path d="M 364,210 H 374 M 370,204 V 214"/>
  </g>

  <!-- Header Title -->
  <text x="20" y="32" class="mono" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="1">
    [02 // PRODUCTIVE HOURS]
  </text>
  <text x="20" y="48" class="mono" font-size="9" fill="#666666">
    COMMITS BY DAY HOUR (UTC +5.50 IST)
  </text>

  <line x1="20" y1="58" x2="360" y2="58" stroke="#222222" stroke-width="1"/>

  <!-- Y-Axis Guides & Values -->
  <g class="mono" font-size="8" fill="#555555" text-anchor="end">
    <line x1="45" y1="75" x2="350" y2="75" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="40" y="78">20</text>

    <line x1="45" y1="105" x2="350" y2="105" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="40" y="108">15</text>

    <line x1="45" y1="135" x2="350" y2="135" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="40" y="138">10</text>

    <line x1="45" y1="165" x2="350" y2="165" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="40" y="168">5</text>

    <line x1="45" y1="180" x2="350" y2="180" stroke="#222222" stroke-width="1"/>
    <text x="40" y="183">0</text>
  </g>

  <!-- 24 Discrete Histogram Bars (Hours 00 to 23) -->
  <g transform="translate(48, 180)">
    <!-- 00 --> <rect x="0" y="-8" width="9" height="8" fill="#333333"/>
    <!-- 01 --> <rect x="12" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 02 --> <rect x="24" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 03 --> <rect x="36" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 04 --> <rect x="48" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 05 --> <rect x="60" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 06 --> <rect x="72" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 07 --> <rect x="84" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 08 --> <rect x="96" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 09 --> <rect x="108" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 10 --> <rect x="120" y="-2" width="9" height="2" fill="#222222"/>
    <!-- 11 --> <rect x="132" y="-12" width="9" height="12" fill="#444444"/>

    <!-- 12 (Mid) --> <rect x="144" y="-32" width="9" height="32" fill="#999999"/>
    <!-- 13 (High Peak) --> <rect class="peak-anim" x="156" y="-105" width="9" height="105" fill="#D71921" filter="url(#timeRedGlow)"/>
    <!-- 14 (High) --> <rect x="168" y="-45" width="9" height="45" fill="#CCCCCC"/>
    <!-- 15 (Mid) --> <rect x="180" y="-28" width="9" height="28" fill="#666666"/>
    <!-- 16 (Mid) --> <rect x="192" y="-35" width="9" height="35" fill="#999999"/>
    <!-- 17 (Low) --> <rect x="204" y="-18" width="9" height="18" fill="#555555"/>
    <!-- 18 (Low) --> <rect x="216" y="-12" width="9" height="12" fill="#444444"/>

    <!-- 19 (High) --> <rect x="228" y="-72" width="9" height="72" fill="#FFFFFF"/>
    <!-- 20 (High Peak) --> <rect class="peak-anim" x="240" y="-95" width="9" height="95" fill="#D71921" filter="url(#timeRedGlow)"/>
    <!-- 21 (Mid) --> <rect x="252" y="-22" width="9" height="22" fill="#888888"/>
    <!-- 22 (Low) --> <rect x="264" y="-12" width="9" height="12" fill="#444444"/>
    <!-- 23 (Low) --> <rect x="276" y="-5" width="9" height="5" fill="#333333"/>
  </g>

  <!-- X-Axis Timeline Labels -->
  <g class="mono" font-size="8" fill="#666666" text-anchor="middle">
    <text x="52" y="196">00</text>
    <text x="124" y="196">06</text>
    <text x="196" y="196">12</text>
    <text x="268" y="196">18</text>
    <text x="328" y="196" fill="#D71921" font-weight="bold">23 (IST)</text>
  </g>

  <!-- Bottom Legend Readout -->
  <g class="mono" font-size="9" fill="#666666">
    <text x="20" y="210">PEAK COMMIT WINDOW: <tspan fill="#D71921" font-weight="bold">13:00 - 14:00 &amp; 20:00 - 21:00 IST</tspan></text>
  </g>
</svg>
