<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%">
  <defs>
    <!-- Dot Matrix Grid Pattern -->
    <pattern id="streakDotGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1" fill="#222222"/>
    </pattern>

    <!-- Signal Red Ring Glow Filter -->
    <filter id="streakRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radar Laser Scan Gradient -->
    <linearGradient id="streakScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D71921" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D71921" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; fill: #FF3B44; }
    }
    @keyframes streakRadar {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateX(475px); opacity: 0; }
    }
    .mono { font-family: 'Space Mono', 'Courier New', monospace; }
    .ring-rotate { transform-origin: 247.5px 72px; animation: ringRotate 12s linear infinite; }
    .flame-anim { transform-origin: 247.5px 44px; animation: flamePulse 2s ease-in-out infinite; }
    .radar-bar { animation: streakRadar 5s ease-in-out infinite; }
  </style>

  <!-- OLED Dark Background -->
  <rect width="495" height="195" fill="#0A0A0A" stroke="#222222" stroke-width="1.5"/>

  <!-- Dot Grid Pattern -->
  <rect width="495" height="195" fill="url(#streakDotGrid)"/>

  <!-- Radar Scanline Sweep Animation -->
  <rect class="radar-bar" x="10" y="10" width="16" height="175" fill="url(#streakScanGrad)"/>

  <!-- Corner Industrial Crosshairs -->
  <g stroke="#444444" stroke-width="1">
    <path d="M 5,10 H 15 M 10,5 V 15"/>
    <path d="M 480,10 H 490 M 485,5 V 15"/>
    <path d="M 5,185 H 15 M 10,180 V 190"/>
    <path d="M 480,185 H 490 M 485,180 V 190"/>
  </g>

  <!-- Column Dividers (1px Signal Red Lines) -->
  <line x1="165" y1="25" x2="165" y2="170" stroke="#D71921" stroke-width="1"/>
  <line x1="330" y1="25" x2="330" y2="170" stroke="#D71921" stroke-width="1"/>

  <!-- LEFT COLUMN: TOTAL CONTRIBUTIONS -->
  <g transform="translate(82.5, 0)">
    <!-- Hero Dot-Matrix Number: 119 -->
    <g fill="#FFFFFF" transform="translate(-32, 60)">
      <!-- 1 -->
      <g transform="translate(0,0)">
        <circle cx="8" cy="0" r="2"/><circle cx="8" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="8" cy="18" r="2"/><circle cx="8" cy="24" r="2"/><circle cx="4" cy="6" r="2"/><circle cx="0" cy="12" r="2"/>
      </g>
      <!-- 1 -->
      <g transform="translate(18,0)">
        <circle cx="8" cy="0" r="2"/><circle cx="8" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="8" cy="18" r="2"/><circle cx="8" cy="24" r="2"/><circle cx="4" cy="6" r="2"/><circle cx="0" cy="12" r="2"/>
      </g>
      <!-- 9 -->
      <g transform="translate(36,0)">
        <circle cx="4" cy="0" r="2"/><circle cx="8" cy="0" r="2"/><circle cx="0" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="0" cy="12" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="4" cy="24" r="2"/><circle cx="8" cy="24" r="2"/>
      </g>
    </g>

    <!-- Label & Dates -->
    <text x="0" y="132" class="mono" font-size="10" font-weight="bold" fill="#E8E8E8" text-anchor="middle" letter-spacing="1">[TOTAL CONTRIBUTIONS]</text>
    <text x="0" y="156" class="mono" font-size="9" fill="#666666" text-anchor="middle">JUL 21, 2021 - PRESENT</text>
  </g>

  <!-- CENTER COLUMN: CURRENT STREAK (HERO FOCUS) -->
  <g transform="translate(247.5, 0)">
    <!-- Animated Glowing Signal Red Ring -->
    <circle cx="0" cy="72" r="34" fill="none" stroke="#D71921" stroke-width="3" filter="url(#streakRedGlow)"/>
    <circle class="ring-rotate" cx="0" cy="72" r="34" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="16 190"/>

    <!-- Flame Icon in Signal Red -->
    <path class="flame-anim" d="M -5,44 C -5,39 -1,36 0,33 C 1,36 5,39 5,44 C 5,47 2,50 0,50 C -2,50 -5,47 -5,44 Z" fill="#D71921"/>

    <!-- Hero Dot-Matrix Number: 4 -->
    <g fill="#FFFFFF" transform="translate(-6, 60)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="6" cy="16" r="2.5"/><circle cx="12" cy="16" r="2.5"/><circle cx="12" cy="0" r="2.5"/><circle cx="12" cy="8" r="2.5"/><circle cx="12" cy="16" r="2.5"/><circle cx="12" cy="24" r="2.5"/>
    </g>

    <!-- Label & Dates -->
    <text x="0" y="132" class="mono" font-size="10" font-weight="bold" fill="#D71921" text-anchor="middle" letter-spacing="1">[CURRENT STREAK]</text>
    <text x="0" y="156" class="mono" font-size="9" fill="#999999" text-anchor="middle">AUG 13 - AUG 16</text>
  </g>

  <!-- RIGHT COLUMN: LONGEST STREAK -->
  <g transform="translate(412.5, 0)">
    <!-- Hero Dot-Matrix Number: 4 -->
    <g fill="#FFFFFF" transform="translate(-6, 60)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="6" cy="16" r="2.5"/><circle cx="12" cy="16" r="2.5"/><circle cx="12" cy="0" r="2.5"/><circle cx="12" cy="8" r="2.5"/><circle cx="12" cy="16" r="2.5"/><circle cx="12" cy="24" r="2.5"/>
    </g>

    <!-- Label & Dates -->
    <text x="0" y="132" class="mono" font-size="10" font-weight="bold" fill="#E8E8E8" text-anchor="middle" letter-spacing="1">[LONGEST STREAK]</text>
    <text x="0" y="156" class="mono" font-size="9" fill="#666666" text-anchor="middle">AUG 13 - AUG 16</text>
  </g>
</svg>
