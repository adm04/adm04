<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <!-- Dot Matrix Grid Pattern -->
    <pattern id="overviewDotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#222222"/>
    </pattern>

    <!-- Signal Red Glow Filter for Radar Polygon -->
    <filter id="radarRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radar Fill Gradient -->
    <linearGradient id="radarFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D71921" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes radarPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes nodeBlink {
      0%, 100% { r: 3.5; opacity: 0.8; }
      50% { r: 5; opacity: 1; }
    }
    .radar-shape {
      transform-origin: 600px 130px;
      animation: radarPulse 3s ease-in-out infinite;
    }
    .radar-node {
      animation: nodeBlink 2s ease-in-out infinite;
    }
    .mono { font-family: 'Space Mono', 'Courier New', monospace; }
  </style>

  <!-- OLED Dark Background -->
  <rect width="800" height="260" rx="12" fill="#0A0A0A" stroke="#222222" stroke-width="1.5"/>

  <!-- Dot Grid Layer -->
  <rect width="800" height="260" rx="12" fill="url(#overviewDotGrid)"/>

  <!-- Corner Crosshairs -->
  <g stroke="#444444" stroke-width="1">
    <path d="M 6,12 H 18 M 12,6 V 18"/>
    <path d="M 782,12 H 794 M 788,6 V 18"/>
    <path d="M 6,248 H 18 M 12,242 V 254"/>
    <path d="M 782,248 H 794 M 788,242 V 254"/>
  </g>

  <!-- Top Left User Badge -->
  <g transform="translate(30, 24)">
    <rect width="96" height="28" rx="6" fill="#111111" stroke="#333333" stroke-width="1"/>
    <circle cx="16" cy="14" r="7" fill="#D71921"/>
    <text x="28" y="18" class="mono" font-size="11" font-weight="bold" fill="#FFFFFF">@adm04</text>
  </g>

  <!-- Section Title -->
  <text x="30" y="80" class="mono" font-size="14" font-weight="bold" fill="#E8E8E8">Activity overview</text>

  <!-- Left Column: Repositories & Metrics -->
  <g transform="translate(30, 110)">
    <!-- Repository Icon -->
    <path d="M 0,0 H 14 V 18 H 0 Z M 3,4 H 11 M 3,8 H 11 M 3,12 H 8" fill="none" stroke="#999999" stroke-width="1.2"/>
    <text x="22" y="12" class="mono" font-size="11" fill="#999999">
      Contributed to <tspan fill="#D71921" font-weight="bold">adm04/adm04</tspan>,
    </text>
    <text x="22" y="30" class="mono" font-size="11" fill="#D71921" font-weight="bold">
      adm04/nothing-design-skill<tspan fill="#999999" font-weight="normal">, and 36 other repos</tspan>
    </text>

    <!-- Metrics Breakdown Readout -->
    <g transform="translate(0, 65)" class="mono" font-size="10" fill="#666666">
      <text x="0" y="0"><tspan fill="#D71921">■</tspan> COMMITS: 78%</text>
      <text x="140" y="0"><tspan fill="#E8E8E8">■</tspan> PULL REQUESTS: 18%</text>
      <text x="0" y="20"><tspan fill="#666666">■</tspan> CODE REVIEW: 3%</text>
      <text x="140" y="20"><tspan fill="#444444">■</tspan> ISSUES: 1%</text>
    </g>
  </g>

  <!-- Middle Divider Line -->
  <line x1="390" y1="30" x2="390" y2="230" stroke="#222222" stroke-width="1"/>

  <!-- Right Column: 4-Axis Radar Chart -->
  <g transform="translate(600, 130)">
    <!-- Outer Concentric Guide Web Rings -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#1F1F1F" stroke-width="1"/>

    <!-- 4 Axes Lines -->
    <!-- Vertical Axis: Code Review (top), Pull Requests (bottom) -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#333333" stroke-width="1.5"/>
    <!-- Horizontal Axis: Commits (left), Issues (right) -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#333333" stroke-width="1.5"/>

    <!-- Axis Labels -->
    <!-- Top: Code Review (3%) -->
    <text x="0" y="-100" class="mono" font-size="10" fill="#999999" text-anchor="middle">3%</text>
    <text x="0" y="-88" class="mono" font-size="10" fill="#666666" text-anchor="middle">Code review</text>

    <!-- Left: Commits (78%) -->
    <text x="-125" y="-6" class="mono" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="end">78%</text>
    <text x="-125" y="8" class="mono" font-size="10" fill="#999999" text-anchor="end">Commits</text>

    <!-- Bottom: Pull Requests (18%) -->
    <text x="0" y="98" class="mono" font-size="10" fill="#E8E8E8" text-anchor="middle">18%</text>
    <text x="0" y="110" class="mono" font-size="10" fill="#666666" text-anchor="middle">Pull requests</text>

    <!-- Right: Issues (1%) -->
    <text x="125" y="-6" class="mono" font-size="10" fill="#666666" text-anchor="start">1%</text>
    <text x="125" y="8" class="mono" font-size="10" fill="#444444" text-anchor="start">Issues</text>

    <!-- Radar Polygon Shape (Commits: -93px, Code Review: -5px, Issues: 4px, PR: 22px) -->
    <g class="radar-shape">
      <polygon points="-93,0 0,-5 4,0 0,22" fill="url(#radarFillGrad)" stroke="#D71921" stroke-width="2" filter="url(#radarRedGlow)"/>
    </g>

    <!-- Radar Node Points -->
    <circle cx="-93" cy="0" r="4" fill="#D71921" class="radar-node"/>
    <circle cx="0" cy="-5" r="3" fill="#FFFFFF"/>
    <circle cx="4" cy="0" r="3" fill="#FFFFFF"/>
    <circle cx="0" cy="22" r="3" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2" fill="#D71921"/>
  </g>
</svg>
