<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Dot Matrix Grid Pattern -->
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#222222"/>
    </pattern>
    <!-- Glow effect for red accent LED -->
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- OLED Dark Background -->
  <rect width="800" height="240" fill="#0A0A0A"/>

  <!-- Dot Grid Pattern Layer -->
  <rect width="800" height="240" fill="url(#dotGrid)"/>

  <!-- Outer Technical Wireframe Border -->
  <rect x="12" y="12" width="776" height="216" fill="none" stroke="#222222" stroke-width="1.5"/>

  <!-- Corner Industrial Crosshairs -->
  <g stroke="#444444" stroke-width="1">
    <path d="M 6,12 H 18 M 12,6 V 18"/>
    <path d="M 782,12 H 794 M 788,6 V 18"/>
    <path d="M 6,228 H 18 M 12,222 V 234"/>
    <path d="M 782,228 H 794 M 788,222 V 234"/>
  </g>

  <!-- Top System Header Bar -->
  <g font-family="'Space Mono', 'Courier New', monospace" font-size="11" fill="#999999" letter-spacing="1">
    <text x="28" y="34">[ND-OS // ADM04_PROFILE]</text>

    <!-- Signal Red Active Status LED -->
    <circle cx="680" cy="30" r="4" fill="#D71921" filter="url(#redGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="692" y="34" fill="#E8E8E8" font-weight="bold">ONLINE</text>
  </g>

  <line x1="12" y1="46" x2="788" y2="46" stroke="#222222" stroke-width="1"/>

  <!-- Hero Dot-Matrix Typography: ARKADEB MONDAL -->
  <g fill="#FFFFFF">
    <!-- Letter A -->
    <g transform="translate(40, 75)">
      <circle cx="12" cy="0" r="2.5"/><circle cx="8" cy="8" r="2.5"/><circle cx="16" cy="8" r="2.5"/><circle cx="4" cy="16" r="2.5"/><circle cx="20" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="8" cy="24" r="2.5"/><circle cx="16" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="24" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="24" cy="40" r="2.5"/>
    </g>
    <!-- Letter R -->
    <g transform="translate(75, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><circle cx="16" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="20" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="20" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="8" cy="24" r="2.5"/><circle cx="16" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="12" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="20" cy="40" r="2.5"/>
    </g>
    <!-- Letter K -->
    <g transform="translate(108, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="20" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="14" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="8" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="8" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="14" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="20" cy="40" r="2.5"/>
    </g>
    <!-- Letter A -->
    <g transform="translate(140, 75)">
      <circle cx="12" cy="0" r="2.5"/><circle cx="8" cy="8" r="2.5"/><circle cx="16" cy="8" r="2.5"/><circle cx="4" cy="16" r="2.5"/><circle cx="20" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="8" cy="24" r="2.5"/><circle cx="16" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="24" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="24" cy="40" r="2.5"/>
    </g>
    <!-- Letter D -->
    <g transform="translate(175, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><circle cx="16" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="20" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="24" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="20" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="8" cy="40" r="2.5"/><circle cx="16" cy="40" r="2.5"/>
    </g>
    <!-- Letter E -->
    <g transform="translate(210, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><circle cx="16" cy="0" r="2.5"/><circle cx="24" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="8" cy="16" r="2.5"/><circle cx="16" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="8" cy="40" r="2.5"/><circle cx="16" cy="40" r="2.5"/><circle cx="24" cy="40" r="2.5"/>
    </g>
    <!-- Letter B -->
    <g transform="translate(245, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><circle cx="16" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="20" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="8" cy="16" r="2.5"/><circle cx="16" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="20" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="20" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="8" cy="40" r="2.5"/><circle cx="16" cy="40" r="2.5"/>
    </g>

    <!-- Space -->

    <!-- Letter M -->
    <g transform="translate(295, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="24" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="6" cy="8" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="24" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="12" cy="16" r="2.5"/><circle cx="24" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="24" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="24" cy="40" r="2.5"/>
    </g>
    <!-- Letter O -->
    <g transform="translate(330, 75)">
      <circle cx="8" cy="0" r="2.5"/><circle cx="16" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="24" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="24" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="24" cy="32" r="2.5"/><circle cx="8" cy="40" r="2.5"/><circle cx="16" cy="40" r="2.5"/>
    </g>
    <!-- Letter N -->
    <g transform="translate(365, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="24" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="6" cy="8" r="2.5"/><circle cx="24" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="12" cy="16" r="2.5"/><circle cx="24" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="18" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="24" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="24" cy="40" r="2.5"/>
    </g>
    <!-- Letter D -->
    <g transform="translate(400, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="8" cy="0" r="2.5"/><circle cx="16" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="20" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="24" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="20" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="8" cy="40" r="2.5"/><circle cx="16" cy="40" r="2.5"/>
    </g>
    <!-- Letter A -->
    <g transform="translate(435, 75)">
      <circle cx="12" cy="0" r="2.5"/><circle cx="8" cy="8" r="2.5"/><circle cx="16" cy="8" r="2.5"/><circle cx="4" cy="16" r="2.5"/><circle cx="20" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="8" cy="24" r="2.5"/><circle cx="16" cy="24" r="2.5"/><circle cx="24" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="24" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="24" cy="40" r="2.5"/>
    </g>
    <!-- Letter L -->
    <g transform="translate(470, 75)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="0" cy="16" r="2.5"/><circle cx="0" cy="24" r="2.5"/><circle cx="0" cy="32" r="2.5"/><circle cx="0" cy="40" r="2.5"/><circle cx="8" cy="40" r="2.5"/><circle cx="16" cy="40" r="2.5"/><circle cx="24" cy="40" r="2.5"/>
    </g>
  </g>

  <!-- Right Instrument Widget: System Parameter Readout -->
  <g transform="translate(560, 68)" font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#999999">
    <rect x="0" y="0" width="200" height="60" fill="#111111" stroke="#222222" stroke-width="1" rx="4"/>
    <text x="12" y="18" fill="#666666" font-size="9" letter-spacing="1">SYSTEM PARAMETERS</text>
    <text x="12" y="36" fill="#E8E8E8">ROLE:</text>
    <text x="50" y="36" fill="#FFFFFF" font-weight="bold">ARCHITECT</text>
    <text x="12" y="50" fill="#E8E8E8">STACK:</text>
    <text x="58" y="50" fill="#D71921">TS / REACT / NODE</text>
  </g>

  <line x1="28" y1="140" x2="772" y2="140" stroke="#222222" stroke-width="1"/>

  <!-- Subtitle Tagline in Monospace Technical Style -->
  <g font-family="'Space Mono', 'Courier New', monospace" font-size="12" fill="#999999" letter-spacing="2">
    <text x="28" y="165" fill="#E8E8E8">FULL-STACK ARCHITECT</text>
    <text x="235" y="165" fill="#D71921">//</text>
    <text x="260" y="165" fill="#999999">UI/UX DESIGNER</text>
    <text x="415" y="165" fill="#D71921">//</text>
    <text x="440" y="165" fill="#666666">FREELANCER</text>
  </g>

  <!-- Bottom Data Readout & Metrics Strip -->
  <g font-family="'Space Mono', monospace" font-size="10" fill="#666666">
    <text x="28" y="200">LOC: INDIA (IST)</text>
    <text x="180" y="200">COORD: 28.61°N 77.20°E</text>
    <text x="400" y="200">UI_DESIGN: NOTHING_V3.0</text>
    <text x="650" y="200" fill="#D71921">[ 01 ] INITIALIZED</text>
  </g>
</svg>
