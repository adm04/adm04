<!doctype html>

<title>Nothing OS Music Player - Spider-Verse</title>
<style>
  html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
  #wrap{width:320px;cursor:pointer;position:relative;}
  #wrap svg{width:100%;height:auto;display:block;}
  .disc-group{ transform-origin:200px 215px; animation:spin 9s linear infinite; animation-play-state:paused; }
  .disc-group.spinning{ animation-play-state:running; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .dim{fill:#6b6b6b;} .dimS{stroke:#6b6b6b;}
  .line{stroke:#2a2a2a;}
  .bright{fill:#eaeaea;} .brightS{stroke:#eaeaea;}
  .mono{letter-spacing:1.5px;}
  #prevBtn, #nextBtn, #playBtn{cursor:pointer;}
  text{font-family:'Courier New',monospace;}
</style>
</head>

  <rect x="160" y="588" width="80" height="4" rx="2" fill="#2a2a2a"/>
</svg>

<script src="https://www.youtube.com/iframe_api"></script>

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function updateProgress() {
    if (!ytPlayer || !isYtReady) return;
    try {
      const cur = ytPlayer.getCurrentTime() || 0;
      const dur = ytPlayer.getDuration() || 0;
      if (dur > 0) {
        timeDisplay.textContent = `${formatTime(cur)}/${formatTime(dur)}`;
        const pct = cur / dur;
        const xPos = 48 + pct * (352 - 48);
        progressLine.setAttribute('x2', xPos);
        progressCircle.setAttribute('cx', xPos);
      }
    } catch(e) {}
  }

  function setPlaying(state) {
    playing = state;
    disc.classList.toggle('spinning', playing);
    if(playing){
      playIcon.setAttribute('points','188,463 188,485 196,485 196,463');
      if(!document.getElementById('pauseBar2')){
        const ns = 'http://www.w3.org/2000/svg';
        const bar = document.createElementNS(ns,'rect');
        bar.setAttribute('id','pauseBar2');
        bar.setAttribute('x','206'); bar.setAttribute('y','463');
        bar.setAttribute('width','8'); bar.setAttribute('height','22');
        bar.setAttribute('fill','#0a0a0a');
        playIcon.parentNode.appendChild(bar);
      }
      if (isYtReady && ytPlayer) {
        ytPlayer.playVideo();
      }
      if (!updateInterval) {
        updateInterval = setInterval(updateProgress, 500);
      }
    } else {
      playIcon.setAttribute('points','192,463 192,485 214,474');
      const bar2 = document.getElementById('pauseBar2');
      if(bar2) bar2.remove();
      if (isYtReady && ytPlayer) {
        ytPlayer.pauseVideo();
      }
      if (updateInterval) {
        clearInterval(updateInterval);
        updateInterval = null;
      }
    }
  }

  wrap.addEventListener('click', () => setPlaying(!playing));

  function renderTrack() {
    const t = tracks[trackIndex];
    trackTitle.textContent = t.title.toUpperCase();
    artistPath.textContent = t.artist.toUpperCase();
    if (isYtReady && ytPlayer && t.youtubeId) {
      ytPlayer.loadVideoById(t.youtubeId);
      if (playing) {
        ytPlayer.playVideo();
      } else {
        ytPlayer.pauseVideo();
      }
    }
  }

  function changeTrack(delta) {
    trackIndex = (trackIndex + delta + tracks.length) % tracks.length;
    renderTrack();
    setPlaying(true);
  }

  document.getElementById('nextBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    changeTrack(1);
  });
  document.getElementById('prevBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    changeTrack(-1);
  });

  // YouTube IFrame API Callback
  window.onYouTubeIframeAPIReady = function() {
    ytPlayer = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      videoId: tracks[0].youtubeId,
      playerVars: {
        autoplay: 0,
        controls: 0,
        playsinline: 1
      },
      events: {
        onReady: function() {
          isYtReady = true;
        },
        onStateChange: function(event) {
          if (event.data === YT.PlayerState.ENDED) {
            changeTrack(1);
          }
        }
      }
    });
  };

  renderTrack();
</script>
