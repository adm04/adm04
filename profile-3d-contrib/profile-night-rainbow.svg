<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <!-- Dot Matrix Background Pattern -->
    <pattern id="contribDotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#222222"/>
    </pattern>

    <!-- Signal Red LED Glow Filter -->
    <filter id="redPillarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radar Laser Scan Gradient -->
    <linearGradient id="contribScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D71921" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D71921" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes scanMatrix {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateX(810px); opacity: 0; }
    }
    @keyframes pillarPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; fill: #FF2E38; }
    }
    @keyframes borderFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .scan-line {
      animation: scanMatrix 5s ease-in-out infinite;
    }
    .peak-pillar {
      animation: pillarPulse 2.5s ease-in-out infinite;
    }
    .border-dash {
      stroke-dasharray: 12 8;
      animation: borderFlow 4s linear infinite;
    }
  </style>

  <!-- OLED Dark Background -->
  <rect width="100%" height="100%" fill="#0A0A0A"/>

  <!-- Dot Grid Pattern Layer -->
  <rect width="100%" height="100%" fill="url(#contribDotGrid)"/>

  <!-- Radar Scanline Sweep Animation -->
  <rect class="scan-line" x="20" y="10" width="20" height="240" fill="url(#contribScanGrad)"/>

  <!-- Outer Technical Wireframe Border -->
  <rect x="10" y="10" width="830" height="240" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect class="border-dash" x="10" y="10" width="830" height="240" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- Corner Industrial Crosshairs -->
  <g stroke="#666666" stroke-width="1">
    <path d="M 4,10 H 16 M 10,4 V 16"/>
    <path d="M 834,10 H 846 M 840,4 V 16"/>
    <path d="M 4,250 H 16 M 10,244 V 256"/>
    <path d="M 834,250 H 846 M 840,244 V 256"/>
  </g>

  <!-- Header Title -->
  <text x="425" y="38" font-family="'Space Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
    [05 // 3D CONTRIBUTION MATRIX]
  </text>
  <text x="425" y="58" font-family="'Space Mono', 'Courier New', monospace" font-size="11" fill="#666666" text-anchor="middle" letter-spacing="1">
    ISOMETRIC ACTIVITY GRAPH // @ADM04
  </text>

  <line x1="25" y1="70" x2="825" y2="70" stroke="#222222" stroke-width="1"/>

  <!-- Main Isometric 3D Grid Workspace -->
  <g transform="translate(140, 95)">
    <!-- Base Isometric Wireframe Grid Floor -->
    <path d="M285 10 L515 95 L285 180 L55 95 Z" fill="#111111" stroke="#222222" stroke-width="1.5"/>

    <!-- Grid Wireframe Mesh Lines -->
    <path d="M170 52 L400 137 M227 31 L457 116 M285 10 L515 95" stroke="#1F1F1F" stroke-width="1"/>
    <path d="M170 137 L400 52 M112 116 L342 31 M55 95 L285 10" stroke="#1F1F1F" stroke-width="1"/>

    <!-- 3D Isometric Contribution Pillars (Monochrome & Signal Red Accents) -->
    <!-- Pillar 1: Muted Monochrome (Low) -->
    <g transform="translate(150, 65)">
      <polygon points="24,15 48,27 48,52 24,40" fill="#333333"/>
      <polygon points="24,15 48,27 24,27 0,15" fill="#444444"/>
      <polygon points="0,15 24,27 24,52 0,40" fill="#222222"/>
    </g>

    <!-- Pillar 2: Secondary Gray (Medium) -->
    <g transform="translate(195, 45)">
      <polygon points="24,10 48,22 48,67 24,55" fill="#666666"/>
      <polygon points="24,10 48,22 24,22 0,10" fill="#888888"/>
      <polygon points="0,10 24,22 24,67 0,55" fill="#444444"/>
    </g>

    <!-- Pillar 3: High White/Primary (High) -->
    <g transform="translate(240, 30)">
      <polygon points="24,0 48,12 48,82 24,70" fill="#CCCCCC"/>
      <polygon points="24,0 48,12 24,12 0,0" fill="#FFFFFF"/>
      <polygon points="0,0 24,12 24,82 0,70" fill="#999999"/>
    </g>

    <!-- Pillar 4: Signal Red Peak Activity (Animated Peak) -->
    <g class="peak-pillar" transform="translate(285, 15)">
      <polygon points="24,0 48,12 48,97 24,85" fill="#D71921" filter="url(#redPillarGlow)"/>
      <polygon points="24,0 48,12 24,12 0,0" fill="#FF525A"/>
      <polygon points="0,0 24,12 24,97 0,85" fill="#A81218"/>
    </g>

    <!-- Pillar 5: High White (High) -->
    <g transform="translate(330, 40)">
      <polygon points="24,5 48,17 48,72 24,60" fill="#CCCCCC"/>
      <polygon points="24,5 48,17 24,17 0,5" fill="#E8E8E8"/>
      <polygon points="0,5 24,17 24,72 0,60" fill="#999999"/>
    </g>

    <!-- Pillar 6: Secondary Gray (Medium) -->
    <g transform="translate(375, 60)">
      <polygon points="24,10 48,22 48,57 24,45" fill="#666666"/>
      <polygon points="24,10 48,22 24,22 0,10" fill="#888888"/>
      <polygon points="0,10 24,22 24,57 0,45" fill="#444444"/>
    </g>
  </g>

  <line x1="25" y1="210" x2="825" y2="210" stroke="#222222" stroke-width="1"/>

  <!-- Footer Technical Status Strip -->
  <g font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#666666">
    <text x="35" y="230">LEVELS: [00] LOW → [03] HIGH → [04] PEAK (SIGNAL RED)</text>
    <text x="680" y="230" fill="#D71921">SYS: ACTIVE [●]</text>
  </g>
</svg>
