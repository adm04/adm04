<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320" viewBox="0 0 850 320">
  <defs>
    <!-- Dot Matrix Grid Pattern -->
    <pattern id="dotMatrixPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#222222"/>
    </pattern>

    <!-- Signal Red Glowing Filter for Peak Blocks -->
    <filter id="peakRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radar Scan Line Gradient -->
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71921" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D71921" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D71921" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes matrixRadar {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateX(810px); opacity: 0; }
    }
    @keyframes peakPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; fill: #FF2E38; }
    }
    @keyframes borderFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .radar-sweep {
      animation: matrixRadar 6s ease-in-out infinite;
    }
    .peak-red {
      animation: peakPulse 2.5s ease-in-out infinite;
    }
    .border-dash {
      stroke-dasharray: 12 8;
      animation: borderFlow 4s linear infinite;
    }
  </style>

  <!-- OLED Dark Background -->
  <rect width="100%" height="100%" fill="#0A0A0A"/>

  <!-- Dot Matrix Pattern Layer -->
  <rect width="100%" height="100%" fill="url(#dotMatrixPattern)"/>

  <!-- Radar Scanline Sweep Animation -->
  <rect class="radar-sweep" x="20" y="10" width="20" height="300" fill="url(#scanlineGrad)"/>

  <!-- Outer Technical Wireframe Border -->
  <rect x="10" y="10" width="830" height="300" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect class="border-dash" x="10" y="10" width="830" height="300" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- Corner Industrial Crosshairs -->
  <g stroke="#666666" stroke-width="1">
    <path d="M 4,10 H 16 M 10,4 V 16"/>
    <path d="M 834,10 H 846 M 840,4 V 16"/>
    <path d="M 4,310 H 16 M 10,304 V 316"/>
    <path d="M 834,310 H 846 M 840,304 V 316"/>
  </g>

  <!-- Header System Bar -->
  <g font-family="'Space Mono', 'Courier New', monospace" letter-spacing="1">
    <text x="30" y="38" font-size="14" font-weight="700" fill="#FFFFFF">[05 // 3D CONTRIBUTION MATRIX]</text>
    <text x="30" y="56" font-size="11" fill="#666666">ISOMETRIC ACTIVITY GRAPH // SYSTEM READOUT @ADM04</text>

    <!-- Top Right Parameter Counter Box -->
    <g transform="translate(615, 24)">
      <rect x="0" y="0" width="200" height="36" fill="#111111" stroke="#222222" stroke-width="1"/>
      <text x="12" y="15" font-size="9" fill="#666666">ANNUAL CONTRIBUTION</text>
      <text x="12" y="28" font-size="11" fill="#FFFFFF" font-weight="bold">1,420 COMMITS</text>
      <circle cx="182" cy="18" r="3.5" fill="#D71921" class="peak-red"/>
    </g>
  </g>

  <line x1="25" y1="70" x2="825" y2="70" stroke="#222222" stroke-width="1"/>

  <!-- Main 3D Isometric Contribution Field -->
  <g transform="translate(140, 110)">
    <!-- Base Isometric Grid Platform -->
    <path d="M285 15 L565 125 L285 235 L5 125 Z" fill="#111111" stroke="#222222" stroke-width="1.5"/>

    <!-- Grid Wireframe Guide Lines -->
    <path d="M145 70 L425 180 M215 42 L495 152 M285 15 L565 125" stroke="#1C1C1C" stroke-width="1"/>
    <path d="M145 180 L425 70 M85 152 L365 42 M5 125 L285 15" stroke="#1F1F1F" stroke-width="1"/>

    <!-- Isometric 3D Columns Grid (Row 0 to 4, Col 0 to 11) -->

    <!-- Column 0 -->
    <g transform="translate(60, 100)">
      <polygon points="12,0 24,6 24,14 12,8" fill="#222222"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#333333"/>
      <polygon points="0,0 12,6 12,14 0,8" fill="#1A1A1A"/>
    </g>
    <g transform="translate(80, 108)">
      <polygon points="12,0 24,6 24,20 12,14" fill="#444444"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#666666"/>
      <polygon points="0,0 12,6 12,20 0,14" fill="#333333"/>
    </g>

    <!-- Column 1 -->
    <g transform="translate(95, 82)">
      <polygon points="12,0 24,6 24,26 12,20" fill="#666666"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#888888"/>
      <polygon points="0,0 12,6 12,26 0,20" fill="#444444"/>
    </g>
    <g transform="translate(115, 90)">
      <polygon points="12,0 24,6 24,34 12,28" fill="#999999"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#CCCCCC"/>
      <polygon points="0,0 12,6 12,34 0,28" fill="#777777"/>
    </g>
    <g transform="translate(135, 98)">
      <polygon points="12,0 24,6 24,18 12,12" fill="#444444"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#666666"/>
      <polygon points="0,0 12,6 12,18 0,12" fill="#333333"/>
    </g>

    <!-- Column 2 -->
    <g transform="translate(130, 65)">
      <polygon points="12,0 24,6 24,14 12,8" fill="#222222"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#333333"/>
      <polygon points="0,0 12,6 12,14 0,8" fill="#1A1A1A"/>
    </g>
    <g transform="translate(150, 73)">
      <polygon points="12,0 24,6 24,40 12,34" fill="#CCCCCC"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FFFFFF"/>
      <polygon points="0,0 12,6 12,40 0,34" fill="#999999"/>
    </g>
    <g transform="translate(170, 81)">
      <polygon points="12,0 24,6 24,28 12,22" fill="#666666"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#888888"/>
      <polygon points="0,0 12,6 12,28 0,22" fill="#444444"/>
    </g>
    <g transform="translate(190, 89)">
      <polygon points="12,0 24,6 24,48 12,42" fill="#CCCCCC"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FFFFFF"/>
      <polygon points="0,0 12,6 12,48 0,42" fill="#999999"/>
    </g>

    <!-- Column 3 (Peak Signal Red Cluster) -->
    <g transform="translate(185, 50)">
      <polygon points="12,0 24,6 24,32 12,26" fill="#888888"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#BBBBBB"/>
      <polygon points="0,0 12,6 12,32 0,26" fill="#666666"/>
    </g>
    <!-- PEAK 1 -->
    <g class="peak-red" transform="translate(205, 58)">
      <polygon points="12,0 24,6 24,56 12,50" fill="#D71921" filter="url(#peakRedGlow)"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FF525A"/>
      <polygon points="0,0 12,6 12,56 0,50" fill="#A81218"/>
    </g>
    <g transform="translate(225, 66)">
      <polygon points="12,0 24,6 24,42 12,36" fill="#CCCCCC"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FFFFFF"/>
      <polygon points="0,0 12,6 12,42 0,36" fill="#999999"/>
    </g>

    <!-- Column 4 (Peak Signal Red Centerpiece) -->
    <g transform="translate(240, 35)">
      <polygon points="12,0 24,6 24,38 12,32" fill="#999999"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#CCCCCC"/>
      <polygon points="0,0 12,6 12,38 0,32" fill="#777777"/>
    </g>
    <!-- PEAK 2 (HERO HIGHEST PEAK) -->
    <g class="peak-red" transform="translate(260, 43)">
      <polygon points="12,0 24,6 24,68 12,62" fill="#D71921" filter="url(#peakRedGlow)"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FF525A"/>
      <polygon points="0,0 12,6 12,68 0,62" fill="#A81218"/>
    </g>
    <!-- PEAK 3 -->
    <g class="peak-red" transform="translate(280, 51)">
      <polygon points="12,0 24,6 24,60 12,54" fill="#D71921" filter="url(#peakRedGlow)"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FF525A"/>
      <polygon points="0,0 12,6 12,60 0,54" fill="#A81218"/>
    </g>
    <g transform="translate(300, 59)">
      <polygon points="12,0 24,6 24,36 12,30" fill="#888888"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#BBBBBB"/>
      <polygon points="0,0 12,6 12,36 0,30" fill="#666666"/>
    </g>

    <!-- Column 5 -->
    <g transform="translate(295, 22)">
      <polygon points="12,0 24,6 24,24 12,18" fill="#444444"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#666666"/>
      <polygon points="0,0 12,6 12,24 0,18" fill="#333333"/>
    </g>
    <g transform="translate(315, 30)">
      <polygon points="12,0 24,6 24,46 12,40" fill="#CCCCCC"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FFFFFF"/>
      <polygon points="0,0 12,6 12,46 0,40" fill="#999999"/>
    </g>
    <g transform="translate(335, 38)">
      <polygon points="12,0 24,6 24,32 12,26" fill="#888888"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#BBBBBB"/>
      <polygon points="0,0 12,6 12,32 0,26" fill="#666666"/>
    </g>
    <g transform="translate(355, 46)">
      <polygon points="12,0 24,6 24,20 12,14" fill="#444444"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#666666"/>
      <polygon points="0,0 12,6 12,20 0,14" fill="#333333"/>
    </g>

    <!-- Column 6 -->
    <g transform="translate(370, 20)">
      <polygon points="12,0 24,6 24,36 12,30" fill="#888888"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#BBBBBB"/>
      <polygon points="0,0 12,6 12,36 0,30" fill="#666666"/>
    </g>
    <g transform="translate(390, 28)">
      <polygon points="12,0 24,6 24,52 12,46" fill="#CCCCCC"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#FFFFFF"/>
      <polygon points="0,0 12,6 12,52 0,46" fill="#999999"/>
    </g>
    <g transform="translate(410, 36)">
      <polygon points="12,0 24,6 24,28 12,22" fill="#666666"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#888888"/>
      <polygon points="0,0 12,6 12,28 0,22" fill="#444444"/>
    </g>

    <!-- Column 7 -->
    <g transform="translate(425, 18)">
      <polygon points="12,0 24,6 24,16 12,10" fill="#222222"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#333333"/>
      <polygon points="0,0 12,6 12,16 0,10" fill="#1A1A1A"/>
    </g>
    <g transform="translate(445, 26)">
      <polygon points="12,0 24,6 24,34 12,28" fill="#888888"/>
      <polygon points="12,0 24,6 12,6 0,0" fill="#BBBBBB"/>
      <polygon points="0,0 12,6 12,34 0,28" fill="#666666"/>
    </g>

    <!-- Base Indicators Labels -->
    <g font-family="'Space Mono', monospace" font-size="9" fill="#666666">
      <text x="30" y="160">Q1</text>
      <text x="140" y="115">Q2</text>
      <text x="260" y="70">Q3 (PEAK)</text>
      <text x="380" y="35">Q4</text>
    </g>
  </g>

  <line x1="25" y1="270" x2="825" y2="270" stroke="#222222" stroke-width="1"/>

  <!-- Design System Legend & Status Strip -->
  <g font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#666666">
    <text x="30" y="294">ACTIVITY LEVEL:</text>

    <!-- Legend Squares -->
    <rect x="135" y="284" width="10" height="10" fill="#222222" stroke="#333333" stroke-width="0.5"/>
    <text x="150" y="293" fill="#666666">NONE</text>

    <rect x="195" y="284" width="10" height="10" fill="#444444"/>
    <text x="210" y="293" fill="#888888">LOW</text>

    <rect x="250" y="284" width="10" height="10" fill="#888888"/>
    <text x="265" y="293" fill="#CCCCCC">MED</text>

    <rect x="305" y="284" width="10" height="10" fill="#FFFFFF"/>
    <text x="320" y="293" fill="#FFFFFF">HIGH</text>

    <rect x="365" y="284" width="10" height="10" fill="#D71921" class="peak-red"/>
    <text x="380" y="293" fill="#D71921" font-weight="bold">PEAK [SIGNAL RED]</text>

    <text x="680" y="294" fill="#999999">[ ADM-OS // VER 3.0 ]</text>
  </g>
</svg>
